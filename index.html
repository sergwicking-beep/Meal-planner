<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dinner Planner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f9f7f4;
      --card: #fff;
      --border: #e5e0d8;
      --accent: #c8622a;
      --accent-hover: #b05524;
      --text: #2c2a27;
      --muted: #7a7570;
      --tag-bg: #f0ebe3;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 32px;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      padding: 16px 0;
      white-space: nowrap;
    }

    nav { display: flex; gap: 4px; }

    nav button {
      background: none;
      border: none;
      padding: 18px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }

    nav button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    nav button:hover:not(.active) { color: var(--text); }

    main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }

    .tab { display: none; }
    .tab.active { display: block; }

    /* Recipes tab */
    .recipes-header {
      margin-bottom: 24px;
    }

    .recipes-header p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .recipe-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      transition: box-shadow 0.15s;
    }

    .recipe-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    .recipe-card h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 6px; }

    .recipe-card .tag {
      display: inline-block;
      background: var(--tag-bg);
      color: var(--muted);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 99px;
    }

    .recipe-card .source {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 8px;
    }

    /* Recipe picker on week tab */
    .recipe-picker {
      margin-bottom: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
    }

    .recipe-picker-label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .recipe-picker-list { display: flex; flex-wrap: wrap; gap: 8px; }

    .recipe-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--tag-bg);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 5px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .recipe-pill:hover { border-color: var(--accent); }

    .recipe-pill.selected {
      background: #fdf5f0;
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .recipe-pill .pill-check { font-size: 0.75rem; }

    /* Week tab */
    .week-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .week-header p { color: var(--muted); font-size: 0.9rem; }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .btn-ghost {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .week-grid { display: flex; flex-direction: column; gap: 8px; }

    .day-row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.15s, background 0.15s, opacity 0.15s;
    }

    .tick-btn {
      width: 26px; height: 26px;
      border: 2px solid var(--border);
      border-radius: 50%;
      background: none;
      cursor: pointer;
      font-size: 0.75rem;
      color: transparent;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .tick-btn:hover { border-color: #22c55e; color: #ccc; }
    .tick-btn.ticked { background: #22c55e; border-color: #22c55e; color: #fff; }

    .day-label {
      width: 88px;
      font-weight: 600;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .day-meal {
      flex: 1;
      font-size: 0.95rem;
    }

    .day-meal .category {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .day-row.cooked .day-meal { opacity: 0.45; text-decoration: line-through; }

    .day-empty {
      flex: 1;
      color: var(--muted);
      font-size: 0.9rem;
      font-style: italic;
    }


    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Shopping list tab */
    .shop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .shop-header p { color: var(--muted); font-size: 0.9rem; }

    .shop-category { margin-bottom: 24px; }

    .shop-category h3 {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .shop-items { display: flex; flex-direction: column; gap: 2px; }

    .shop-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }

    .shop-item input[type="checkbox"] {
      width: 17px; height: 17px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .shop-item label {
      display: flex;
      justify-content: space-between;
      width: 100%;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .shop-item.checked label { color: var(--muted); text-decoration: line-through; }

    .shop-item .remove-btn {
      background: none;
      border: none;
      color: var(--border);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .shop-item .remove-btn:hover { color: var(--accent); }

    .add-item-form {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .add-item-form input {
      flex: 1;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      background: var(--card);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .add-item-form input:focus { border-color: var(--accent); }
    .add-item-form input::placeholder { color: var(--muted); }

    .shop-item .amount { color: var(--muted); font-size: 0.85rem; }

    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--muted);
    }

    .empty-state h2 { font-size: 1.2rem; margin-bottom: 8px; }
    .empty-state p { font-size: 0.9rem; }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      width: min(480px, 90vw);
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal h2 { font-size: 1.1rem; margin-bottom: 4px; }
    .modal p { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }

    .modal-list { display: flex; flex-direction: column; gap: 6px; }

    .modal-recipe-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      text-align: left;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.15s;
    }

    .modal-recipe-btn:hover { border-color: var(--accent); color: var(--accent); }
    .modal-recipe-btn .tag { font-size: 0.75rem; color: var(--muted); }

    .modal-close {
      float: right;
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--muted);
      line-height: 1;
      margin-top: -4px;
    }

    /* Recipe detail modal */
    .recipe-detail-ingredients { margin: 16px 0; }
    .recipe-detail-ingredients li {
      font-size: 0.88rem;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .recipe-detail-ingredients li span { color: var(--muted); font-size: 0.85rem; }
    .recipe-detail-instructions {
      margin-top: 20px;
      font-size: 0.88rem;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
    }
    .recipe-detail-instructions h4 {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .recipe-card { cursor: pointer; }
    .recipe-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-color: var(--border); }

    .error-banner {
      background: #fde8e8;
      border: 1px solid #f5c0c0;
      color: #b91c1c;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <h1>Dinner Planner</h1>
  <nav>
    <button data-tab="week" class="active">This Week</button>
    <button data-tab="recipes">Recipes</button>
    <button data-tab="shopping">Shopping List</button>
  </nav>
</header>

<main>
  <!-- Recipes tab -->
  <div id="tab-recipes" class="tab">
    <div class="recipes-header">
      <h2>Your Recipes</h2>
      <p>All your saved dinners.</p>
    </div>
    <div class="recipe-grid" id="recipe-grid"></div>
  </div>

  <!-- Week tab -->
  <div id="tab-week" class="tab active">
    <div class="week-header">
      <div>
        <h2>This Week</h2>
        <p id="week-subtitle">Pick meals to include, then generate a plan.</p>
      </div>
      <button class="btn" id="generate-btn">Generate Plan</button>
    </div>
    <div class="recipe-picker">
      <div class="recipe-picker-label">Must include</div>
      <div class="recipe-picker-list" id="recipe-picker-list"></div>
    </div>
    <div id="week-error"></div>
    <div class="week-grid" id="week-grid"></div>
  </div>

  <!-- Shopping list tab -->
  <div id="tab-shopping" class="tab">
    <div class="shop-header">
      <div>
        <h2>Shopping List</h2>
        <p id="shop-subtitle">Based on this week's dinners.</p>
      </div>
      <button class="btn-ghost" id="clear-checked-btn">Clear checked</button>
    </div>
    <form class="add-item-form" id="add-item-form">
      <input type="text" id="add-item-input" placeholder="Add an item…" autocomplete="off" />
      <button type="submit" class="btn">Add</button>
    </form>
    <div id="shopping-list"></div>
  </div>
</main>

<!-- Recipe detail modal -->
<div class="modal-backdrop" id="recipe-modal">
  <div class="modal">
    <button class="modal-close" id="recipe-modal-close">×</button>
    <h2 id="recipe-modal-title"></h2>
    <p id="recipe-modal-source" style="color:var(--muted);font-size:0.8rem;margin-top:4px;margin-bottom:0"></p>
    <ul class="recipe-detail-ingredients" id="recipe-modal-ingredients"></ul>
    <div class="recipe-detail-instructions" id="recipe-modal-instructions"></div>
  </div>
</div>

<!-- Swap modal -->
<div class="modal-backdrop" id="swap-modal">
  <div class="modal">
    <button class="modal-close" id="modal-close">×</button>
    <h2>Swap Meal</h2>
    <p id="modal-day-label"></p>
    <div class="modal-list" id="modal-list"></div>
  </div>
</div>

<script>
  const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const LS = {
    selected: 'mp_selected',
    plan: 'mp_plan',
    checked: 'mp_checked',
    custom: 'mp_custom',
    cooked: 'mp_cooked',
  };

  let recipes = [];
  let selectedIds = load(LS.selected) || [];
  let weekPlan = load(LS.plan) || DAYS.map(d => ({ day: d, recipe: null }));
  let checkedItems = load(LS.checked) || {};
  let customItems = load(LS.custom) || [];
  let cookedDays = load(LS.cooked) || [];
  let swapTargetDay = null;

  function load(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
  }

  function save(key, val) {
    localStorage.setItem(key, JSON.stringify(val));
  }

  // --- Nav ---
  document.querySelectorAll('nav button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'shopping') renderShopping();
    });
  });

  // --- Load recipes ---
  async function loadRecipes() {
    const res = await fetch('/recipes.json');
    recipes = await res.json();
    renderRecipeGrid();
    renderRecipePicker();
    renderWeek();
  }

  // --- Recipes tab (read-only) ---
  function renderRecipeGrid() {
    const grid = document.getElementById('recipe-grid');
    grid.innerHTML = recipes.map(r => {
      const src = r.source
        ? `${r.source.book}${r.source.page ? `, p.${r.source.page}` : ''}`
        : '';
      return `
        <div class="recipe-card" data-id="${r.id}" role="button" tabindex="0">
          <h3>${r.name}</h3>
          <span class="tag">${r.category}</span>
          ${src ? `<span class="source">${src}</span>` : ''}
        </div>`;
    }).join('');

    grid.querySelectorAll('.recipe-card').forEach(card => {
      card.addEventListener('click', () => openRecipeModal(card.dataset.id));
    });
  }

  // --- Recipe picker on week tab ---
  function renderRecipePicker() {
    const list = document.getElementById('recipe-picker-list');
    list.innerHTML = recipes.map(r => `
      <div class="recipe-pill ${selectedIds.includes(r.id) ? 'selected' : ''}" data-id="${r.id}">
        ${selectedIds.includes(r.id) ? '<span class="pill-check">✓</span>' : ''}
        ${r.name}
      </div>
    `).join('');

    list.querySelectorAll('.recipe-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        const id = pill.dataset.id;
        selectedIds = selectedIds.includes(id)
          ? selectedIds.filter(x => x !== id)
          : [...selectedIds, id];
        save(LS.selected, selectedIds);
        renderRecipePicker();
      });
    });
  }

  // --- Week tab ---
  function renderWeek() {
    const grid = document.getElementById('week-grid');
    grid.innerHTML = weekPlan.map((entry, i) => {
      const cooked = cookedDays.includes(entry.day);
      return `
        <div class="day-row ${cooked ? 'cooked' : ''}">
          <button class="tick-btn ${cooked ? 'ticked' : ''}" data-tick="${i}" title="Mark as cooked">✓</button>
          <span class="day-label">${entry.day}</span>
          ${entry.recipe
            ? `<div class="day-meal">
                 <div>${entry.recipe.name}</div>
                 <div class="category">${entry.recipe.category}</div>
               </div>
               <button class="btn-ghost swap-btn" data-swap="${i}">Swap</button>
               <button class="btn-ghost move-btn" data-move="${i}">Move</button>`
            : `<div class="day-empty">No meal planned</div>
               <button class="btn-ghost swap-btn" data-swap="${i}">Pick</button>`
          }
        </div>`;
    }).join('');

    grid.querySelectorAll('.tick-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const day = weekPlan[parseInt(btn.dataset.tick)].day;
        cookedDays = cookedDays.includes(day)
          ? cookedDays.filter(d => d !== day)
          : [...cookedDays, day];
        save(LS.cooked, cookedDays);
        renderWeek();
      });
    });

    grid.querySelectorAll('.swap-btn').forEach(btn => {
      btn.addEventListener('click', () => openSwapModal(parseInt(btn.dataset.swap)));
    });

    grid.querySelectorAll('.move-btn').forEach(btn => {
      btn.addEventListener('click', () => openMoveModal(parseInt(btn.dataset.move)));
    });
  }

  // --- Move modal ---
  let moveSrcIndex = null;

  function openMoveModal(srcIndex) {
    moveSrcIndex = srcIndex;
    const srcDay = weekPlan[srcIndex].day;
    document.getElementById('modal-day-label').textContent =
      `Move ${srcDay}'s meal to which day?`;
    const list = document.getElementById('modal-list');
    list.innerHTML = weekPlan
      .filter((_, i) => i !== srcIndex && weekPlan[i].recipe)
      .map(entry => `
        <button class="modal-recipe-btn" data-move-to="${DAYS.indexOf(entry.day)}">
          <span>${entry.day}</span>
          <span class="tag">${entry.recipe.name}</span>
        </button>`).join('');
    list.querySelectorAll('.modal-recipe-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const destIdx = parseInt(btn.dataset.moveTo);
        const tmp = weekPlan[moveSrcIndex].recipe;
        weekPlan[moveSrcIndex].recipe = weekPlan[destIdx].recipe;
        weekPlan[destIdx].recipe = tmp;
        save(LS.plan, weekPlan);
        closeModal();
        renderWeek();
      });
    });
    document.getElementById('swap-modal').classList.add('open');
  }

  document.getElementById('generate-btn').addEventListener('click', generatePlan);

  async function generatePlan() {
    const btn = document.getElementById('generate-btn');
    const errorEl = document.getElementById('week-error');
    errorEl.innerHTML = '';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Generating…';

    try {
      const res = await fetch('/api/generate-plan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ selectedIds }),
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Server error');
      weekPlan = data.plan;
      save(LS.plan, weekPlan);
      cookedDays = [];
      save(LS.cooked, cookedDays);
      checkedItems = {};
      save(LS.checked, checkedItems);
      renderWeek();
    } catch (err) {
      errorEl.innerHTML = `<div class="error-banner">Could not generate plan: ${err.message}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generate Plan';
    }
  }

  // --- Swap modal ---
  function openSwapModal(dayIndex) {
    swapTargetDay = dayIndex;
    const entry = weekPlan[dayIndex];
    document.getElementById('modal-day-label').textContent =
      `Choose a meal for ${entry.day}`;

    const list = document.getElementById('modal-list');
    list.innerHTML = recipes.map(r => `
      <button class="modal-recipe-btn" data-recipe-id="${r.id}">
        <span>${r.name}</span>
        <span class="tag">${r.category}</span>
      </button>
    `).join('');

    list.querySelectorAll('.modal-recipe-btn').forEach(btn => {
      btn.addEventListener('click', () => swapMeal(btn.dataset.recipeId));
    });

    document.getElementById('swap-modal').classList.add('open');
  }

  function swapMeal(recipeId) {
    const recipe = recipes.find(r => r.id === recipeId);
    weekPlan[swapTargetDay].recipe = recipe;
    save(LS.plan, weekPlan);
    checkedItems = {};
    save(LS.checked, checkedItems);
    closeModal();
    renderWeek();
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('swap-modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });

  function closeModal() {
    document.getElementById('swap-modal').classList.remove('open');
    swapTargetDay = null;
  }

  // --- Shopping list ---
  function renderShopping() {
    const container = document.getElementById('shopping-list');
    const meals = weekPlan.filter(e => e.recipe);

    if (meals.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <h2>No meals planned yet</h2>
          <p>Generate a plan on the This Week tab first.</p>
        </div>`;
      return;
    }

    // Aggregate ingredients
    const byCategory = {};
    meals.forEach(({ recipe }) => {
      recipe.ingredients.forEach(ing => {
        const cat = ing.category;
        if (!byCategory[cat]) byCategory[cat] = [];
        // Merge duplicates by name
        const existing = byCategory[cat].find(i => i.name === ing.name);
        if (existing) {
          existing.amounts.push(ing.amount);
        } else {
          byCategory[cat].push({ name: ing.name, amounts: [ing.amount] });
        }
      });
    });

    const catOrder = ['Meat', 'Seafood', 'Dairy', 'Veg', 'Pantry', 'Other'];
    const sorted = Object.keys(byCategory).sort(
      (a, b) => (catOrder.indexOf(a) - catOrder.indexOf(b))
    );

    const subtitle = document.getElementById('shop-subtitle');
    subtitle.textContent = `${meals.length} dinner${meals.length > 1 ? 's' : ''} this week`;

    const customHtml = customItems.length ? `
      <div class="shop-category">
        <h3>Extra</h3>
        <div class="shop-items">
          ${customItems.map(item => {
            const key = `custom__${item.id}`;
            const checked = !!checkedItems[key];
            return `
              <div class="shop-item ${checked ? 'checked' : ''}" data-key="${key}">
                <input type="checkbox" id="chk-${key}" ${checked ? 'checked' : ''} />
                <label for="chk-${key}"><span>${item.name}</span></label>
                <button class="remove-btn" data-custom-id="${item.id}" title="Remove">×</button>
              </div>`;
          }).join('')}
        </div>
      </div>` : '';

    container.innerHTML = sorted.map(cat => {
      const items = byCategory[cat];
      return `
        <div class="shop-category">
          <h3>${cat}</h3>
          <div class="shop-items">
            ${items.map(item => {
              const key = item.name;
              const checked = !!checkedItems[key];
              const amountStr = [...new Set(item.amounts)].join(' + ');
              return `
                <div class="shop-item ${checked ? 'checked' : ''}" data-key="${key}">
                  <input type="checkbox" id="chk-${key}" ${checked ? 'checked' : ''} />
                  <label for="chk-${key}">
                    <span>${item.name}</span>
                    <span class="amount">${amountStr}</span>
                  </label>
                </div>`;
            }).join('')}
          </div>
        </div>`;
    }).join('') + customHtml;

    container.querySelectorAll('.shop-item').forEach(row => {
      const key = row.dataset.key;
      const checkbox = row.querySelector('input');
      const toggle = () => {
        checkedItems[key] = !checkedItems[key];
        save(LS.checked, checkedItems);
        row.classList.toggle('checked', checkedItems[key]);
        checkbox.checked = checkedItems[key];
      };
      checkbox.addEventListener('change', toggle);
      row.addEventListener('click', e => {
        if (e.target !== checkbox && !e.target.classList.contains('remove-btn')) toggle();
      });
    });

    container.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        customItems = customItems.filter(i => i.id !== btn.dataset.customId);
        save(LS.custom, customItems);
        renderShopping();
      });
    });
  }

  document.getElementById('add-item-form').addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('add-item-input');
    const name = input.value.trim();
    if (!name) return;
    customItems.push({ id: Date.now().toString(), name });
    save(LS.custom, customItems);
    input.value = '';
    renderShopping();
  });

  document.getElementById('clear-checked-btn').addEventListener('click', () => {
    checkedItems = {};
    save(LS.checked, checkedItems);
    renderShopping();
  });

  // --- Recipe detail modal ---
  function openRecipeModal(id) {
    const r = recipes.find(x => x.id === id);
    if (!r) return;
    document.getElementById('recipe-modal-title').textContent = r.name;
    const src = r.source
      ? `${r.source.book}${r.source.page ? `, p.${r.source.page}` : ''}`
      : '';
    document.getElementById('recipe-modal-source').textContent = src;
    document.getElementById('recipe-modal-ingredients').innerHTML =
      r.ingredients.map(i => `<li><span>${i.name}</span><span>${i.amount}</span></li>`).join('');
    const instrEl = document.getElementById('recipe-modal-instructions');
    if (r.instructions) {
      instrEl.innerHTML = `<h4>Method</h4>${r.instructions}`;
    } else {
      instrEl.innerHTML = '';
    }
    document.getElementById('recipe-modal').classList.add('open');
  }

  document.getElementById('recipe-modal-close').addEventListener('click', () =>
    document.getElementById('recipe-modal').classList.remove('open'));
  document.getElementById('recipe-modal').addEventListener('click', e => {
    if (e.target === e.currentTarget)
      document.getElementById('recipe-modal').classList.remove('open');
  });

  // Boot
  loadRecipes();
</script>
</body>
</html>
